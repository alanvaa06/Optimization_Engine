name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Ruff needs none of the project's dependencies, so this reports style
      # failures in seconds rather than after a full scientific-stack install.
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Check
        run: ruff check src app tests scripts

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # What mypy *runs* on. What it *checks for* is 3.9, set by
          # ``[tool.mypy] python_version`` — the floor this package promises.
          # The two differ because mypy 2.x refuses to target 3.9 at all and
          # pandas-stubs' current releases need 3.11 to install.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Unlike ruff, mypy cannot work from the source tree alone. Most of what
      # it has to say here is about pandas and numpy types, and it knows those
      # only from the installed packages and their stubs — so this job pays for
      # a full install where the lint job pays for one wheel.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Check
        run: mypy src/optimization_engine
      # The allowlist size is the number worth watching: it counts the modules
      # whose type errors are deferred rather than fixed, and the only
      # direction it may move is down — which is what the test module
      # ``test_typecheck_allowlist`` enforces. Reported even when the check
      # above fails, because a red check is exactly when somebody wants to
      # know how much is still outstanding.
      - name: Report the deferred-module allowlist
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          modules = [
              module
              for override in config["tool"]["mypy"].get("overrides", [])
              if override.get("ignore_errors")
              for module in override["module"]
          ]
          print("### mypy allowlist")
          print()
          print(f"**{len(modules)}** modules still have their type errors deferred.")
          print("Every other module under `src/optimization_engine` type-checks clean.")
          print()
          print("<details><summary>Deferred modules</summary>")
          print()
          for module in modules:
              print(f"- `{module}`")
          print()
          print("</details>")
          PY

  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every cell is written out instead of being generated from a cross
      # product, for two reasons. An ``include:`` entry whose keys match a
      # generated cell is *merged into* it rather than added alongside it, so
      # a pinned-pandas entry would quietly replace the unpinned 3.11 cell
      # instead of joining it. And a 2 × 4 OS/Python product is eight cells
      # buying a difference that is not Python's — see the Windows note below.
      matrix:
        include:
          # The floor declared in pyproject's requires-python, the version the
          # project is developed on, and the current release.
          - os: ubuntu-latest
            python-version: "3.9"
            label: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
            label: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
            label: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
            label: "3.12"
          # One Windows cell, not four. What differs on Windows here is the
          # filesystem, not the language: the cache's atomic ``os.replace``
          # against a reader's open handle, path separators, and temp-file
          # cleanup. None of that changes between CPython minors, while a
          # Windows runner bills at twice a Linux one — so the other three
          # would triple this cell's cost to re-run its own coverage.
          # Only this job gains Windows: ``smoke`` writes /tmp/ci_report.xlsx
          # and release.yml writes /tmp/report.xlsx, both POSIX-only.
          - os: windows-latest
            python-version: "3.12"
            label: "3.12 / Windows"
          # pandas 2.1 is the floor in ``dependencies`` and the last release
          # whose ``pct_change`` pads gaps by default, so it is the only
          # version in this matrix that can *see* a dropped
          # ``fill_method=None``: everything else resolves to pandas 3.x,
          # where the padding is already gone and the regression is invisible.
          # 3.11 because pandas 2.1.4 ships a cp311 wheel and its own metadata
          # caps ``numpy<2``, which is what keeps this cell's stack
          # self-consistent without a second pin here.
          - os: ubuntu-latest
            python-version: "3.11"
            pandas: "pandas==2.1.*"
            label: "3.11 / pandas 2.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # ``matrix.pandas`` is empty on every cell but the pinned one, where it
        # carries the specifier. It goes into the same resolve rather than a
        # downgrade afterwards, so pip picks one internally consistent stack
        # instead of leaving numpy where a later pandas put it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" ${{ matrix.pandas }}
      - name: Test
        # The suite is fully offline: the Yahoo and FRED loaders are mocked,
        # so nothing here depends on a network round-trip.
        run: pytest -q --durations=10

  extras:
    name: Optional extras (Streamlit, MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # One version, not the matrix, for two reasons that happen to
          # agree. Streamlit is an optional extra whose own floor moves
          # faster than this project's, and what its tests cover is the page
          # script's wiring rather than anything version-dependent. The MCP
          # SDK needs Python 3.10, so it cannot go in a matrix that includes
          # 3.9 at all.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev,ui,mcp]"
      # Both suites skip silently everywhere else — the matrix installs
      # neither extra — so without this job they would look like coverage
      # and be nothing of the kind.
      #
      # The app tests are globbed rather than listed, because an enumerated
      # list silently stops covering the file somebody adds next. The MCP
      # file is named because there is one of it.
      - name: Test
        run: pytest -q tests/test_app_*.py tests/test_ui_state.py tests/test_mcp_server.py
      # The suites above import the SDK directly. This asserts the packaging
      # is right too: the extra installs, and the console script the README
      # tells people to run actually exists on PATH.
      - name: The MCP console script is installed
        run: |
          python -c "import mcp.server.mcpserver"
          command -v optengine-mcp

  core:
    name: Core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Deliberately no extras. This job is what keeps the core small: a
      # module-level ``import plotly`` added anywhere on an import path the
      # package touches at load time would pass every other job here and
      # fail only for users who installed without extras.
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: No optional dependency leaked into the core
        run: |
          python - <<'PY'
          import importlib, sys
          leaked = []
          for mod in ("plotly", "statsmodels", "openpyxl", "xlsxwriter",
                      "matplotlib", "seaborn", "yfinance", "streamlit"):
              try:
                  importlib.import_module(mod)
              except ImportError:
                  continue
              leaked.append(mod)
          if leaked:
              sys.exit(f"optional dependencies present in a core install: {leaked}")
          print("core install is clean")
          PY
      - name: The core solves, reports and ingests
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          import optimization_engine as oe

          rng = np.random.default_rng(0)
          returns = pd.DataFrame(
              rng.normal(0.0004, 0.01, (750, 4)),
              columns=list("ABCD"),
              index=pd.bdate_range("2021-01-01", periods=750),
          )
          # The default covariance estimator is Ledoit-Wolf, so this also
          # asserts scikit-learn stayed in the core.
          run = oe.run_engine(returns, oe.EngineConfig(
              optimizer=oe.OptimizerSpec(name="max_sharpe")))
          assert abs(float(run.result.weights.sum()) - 1.0) < 1e-6

          # Importable without plotly / statsmodels installed.
          import optimization_engine.analytics.relative  # noqa: F401
          import optimization_engine.reporting.plots  # noqa: F401

          panel = oe.ingest.ingest(
              oe.IngestRequest(identifiers=["A", "B"], provider="sample"))
          assert not panel.prices.empty
          print("core engine OK")
          PY
      - name: A missing extra names the extra
        run: |
          python - <<'PY'
          import pandas as pd
          from optimization_engine.reporting.plots import plot_correlation_heatmap
          try:
              plot_correlation_heatmap(pd.DataFrame([[1.0, 0.2], [0.2, 1.0]]))
          except ImportError as exc:
              assert "finport-optengine[viz]" in str(exc), str(exc)
              print("error message points at the right extra")
          else:
              raise SystemExit("expected ImportError without plotly")
          PY

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      # Exercises the installed console-script entry point, which unit tests
      # calling main() directly would not catch if packaging broke.
      - name: Method registry
        run: optengine list-optimizers
      - name: Pre-flight the example config
        run: optengine check --config config/example_multi_asset.yaml --sample
      - name: End-to-end optimize
        run: |
          optengine optimize \
            --config config/example_multi_asset.yaml \
            --sample --frontier --strict \
            --output /tmp/ci_report.xlsx
      - name: Report was written
        run: test -s /tmp/ci_report.xlsx
      # The backtest command reaches code the optimize path never touches:
      # the simulation core, the cost models, and the sweep runner that feeds
      # the selection-bias diagnostics.
      - name: End-to-end backtest with a sweep
        run: |
          optengine backtest \
            --config config/example_multi_asset.yaml \
            --sample --lookback 504 --rebalance-every 252 \
            --commission-bps 8 --slippage-bps 4 --impact-eta 0.3 \
            --sweep optimizer.name=min_variance,equal_weight \
            --output /tmp/ci_backtest.xlsx
      - name: Tearsheet was written
        run: test -s /tmp/ci_backtest.xlsx
