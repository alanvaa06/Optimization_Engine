# Illustrative example configuration.
# These values are made-up round numbers for documentation and CLI demos.
# They are not a capital-market assumption and are not an allocation
# constraint from any mandate or firm.

periods_per_year: 252
covariance_method: ledoit_wolf
ewma_lambda: 0.94

optimizer:
  name: mean_variance        # mean_variance | min_variance | max_sharpe |
                             # risk_parity | hrp | black_litterman | cvar |
                             # max_diversification | equal_weight | inverse_vol
  target_return: 0.07
  risk_free_rate: 0.04
  risk_aversion: 2.5
  cvar_alpha: 0.05

# Annualized expected returns per asset.
expected_returns:
  US_Equity: 0.080
  Intl_Equity: 0.070
  EM_Equity: 0.090
  Real_Estate: 0.060
  Commodities: 0.040
  Infra: 0.070
  Gold: 0.040
  US_Treasuries: 0.030
  TIPS: 0.030
  IG_Credit: 0.040
  HY_Credit: 0.050
  EM_Debt: 0.050
  Cash: 0.025

# Per-asset weight bounds [lo, hi].
bounds:
  US_Equity:     [0.00, 0.50]
  Intl_Equity:   [0.00, 0.30]
  EM_Equity:     [0.00, 0.20]
  Real_Estate:   [0.00, 0.10]
  Commodities:   [0.00, 0.10]
  Infra:         [0.00, 0.10]
  Gold:          [0.00, 0.10]
  US_Treasuries: [0.00, 0.40]
  TIPS:          [0.00, 0.20]
  IG_Credit:     [0.00, 0.30]
  HY_Credit:     [0.00, 0.10]
  EM_Debt:       [0.00, 0.15]
  Cash:          [0.00, 0.20]

# Optional asset-class mapping.
groups:
  US_Equity:     Equity
  Intl_Equity:   Equity
  EM_Equity:     Equity
  Real_Estate:   Alternatives
  Commodities:   Alternatives
  Infra:         Alternatives
  Gold:          Alternatives
  US_Treasuries: FixedIncome
  TIPS:          FixedIncome
  IG_Credit:     FixedIncome
  HY_Credit:     FixedIncome
  EM_Debt:       FixedIncome
  Cash:          FixedIncome

# Optional group bounds.
group_bounds:
  Equity:       [0.30, 0.70]
  Alternatives: [0.00, 0.20]
  FixedIncome:  [0.20, 0.60]

# What the portfolio is measured — and, with a limit set below, optimized —
# against. Stated once so the report and the solve cannot disagree about it.
#
#   kind:      none | equal_weight | single_asset | custom_weights | external
#   asset:     the universe member, for kind: single_asset
#   weights:   {asset: weight}, for kind: custom_weights (normalized to 1)
#   rebalance: periodic (index convention) | buy_and_hold (weights drift)
benchmark:
  kind: equal_weight
  rebalance: periodic

# Active-risk limits, both measured against the benchmark's positions.
# Left unset here: this config also targets a 7% return, and a budget tight
# enough to be interesting puts that target out of reach — which the
# feasibility report will tell you, in those words, if you set both.
#
# max_tracking_error: 0.03   # √((w−b)'Σ(w−b)) ≤ 3% a year
# max_active_share: 0.50     # ½·Σ|wᵢ−bᵢ| ≤ 50%
