# Illustrative example configuration.
# These values are made-up round numbers for documentation and CLI demos.
# They are not a capital-market assumption and are not an allocation
# constraint from any mandate or firm.

periods_per_year: 252
covariance_method: ledoit_wolf
ewma_lambda: 0.94

optimizer:
  name: mean_variance        # mean_variance | min_variance | max_sharpe |
                             # risk_parity | hrp | black_litterman | cvar |
                             # max_diversification | equal_weight | inverse_vol
  target_return: 0.07
  risk_free_rate: 0.04
  risk_aversion: 2.5
  cvar_alpha: 0.05

# Annualized expected returns per asset.
expected_returns:
  US_Equity: 0.080
  Intl_Equity: 0.070
  EM_Equity: 0.090
  Real_Estate: 0.060
  Commodities: 0.040
  Infra: 0.070
  Gold: 0.040
  US_Treasuries: 0.030
  TIPS: 0.030
  IG_Credit: 0.040
  HY_Credit: 0.050
  EM_Debt: 0.050
  Cash: 0.025

# Per-asset weight bounds [lo, hi].
bounds:
  US_Equity:     [0.00, 0.50]
  Intl_Equity:   [0.00, 0.30]
  EM_Equity:     [0.00, 0.20]
  Real_Estate:   [0.00, 0.10]
  Commodities:   [0.00, 0.10]
  Infra:         [0.00, 0.10]
  Gold:          [0.00, 0.10]
  US_Treasuries: [0.00, 0.40]
  TIPS:          [0.00, 0.20]
  IG_Credit:     [0.00, 0.30]
  HY_Credit:     [0.00, 0.10]
  EM_Debt:       [0.00, 0.15]
  Cash:          [0.00, 0.20]

# Optional asset-class mapping.
groups:
  US_Equity:     Equity
  Intl_Equity:   Equity
  EM_Equity:     Equity
  Real_Estate:   Alternatives
  Commodities:   Alternatives
  Infra:         Alternatives
  Gold:          Alternatives
  US_Treasuries: FixedIncome
  TIPS:          FixedIncome
  IG_Credit:     FixedIncome
  HY_Credit:     FixedIncome
  EM_Debt:       FixedIncome
  Cash:          FixedIncome

# Optional group bounds. This is layer 1 of the allocation policy.
group_bounds:
  Equity:       [0.30, 0.70]
  Alternatives: [0.00, 0.20]
  FixedIncome:  [0.20, 0.60]

# Further layers of the same policy, all binding at once. Each one slices the
# universe its own way and caps each slice; every limit stays linear in the
# weights, so the problem stays convex and every optimizer keeps its
# guarantees.
#
#   basis: portfolio  — the limit is a share of the whole book (the default)
#   basis: parent     — the limit is a share of the parent layer's bucket, so
#                       "30% emerging" means 30% *of the equity sleeve* and
#                       moves with whatever the optimizer allocates to equity.
#                       Name the parent layer with `parent:`; the parent
#                       *bucket* of each child is derived from the assignments
#                       rather than typed twice.
#
# The layer built from `groups` above is called "Asset class".
constraint_layers:
  # "Inside equity, at most 30% emerging; inside fixed income, at most 25%."
  - name: Sub-asset class
    basis: parent
    parent: Asset class
    assignments:
      US_Equity:     DM Equity
      Intl_Equity:   DM Equity
      EM_Equity:     EM Equity
      US_Treasuries: DM Fixed Income
      TIPS:          DM Fixed Income
      IG_Credit:     DM Fixed Income
      HY_Credit:     DM Fixed Income
      EM_Debt:       EM Fixed Income
      Cash:          DM Fixed Income
    limits:
      DM Equity:       [0.70, 1.00]
      EM Equity:       [0.00, 0.30]
      DM Fixed Income: [0.75, 1.00]
      EM Fixed Income: [0.00, 0.25]

  # "At most 30% of the book in foreign currency." Cuts across asset classes,
  # which is exactly what a single flat grouping cannot express.
  - name: FX exposure
    assignments:
      US_Equity:     Local FX
      Intl_Equity:   Foreign FX
      EM_Equity:     Foreign FX
      Real_Estate:   Local FX
      Commodities:   Foreign FX
      Infra:         Local FX
      Gold:          Foreign FX
      US_Treasuries: Local FX
      TIPS:          Local FX
      IG_Credit:     Local FX
      HY_Credit:     Local FX
      EM_Debt:       Foreign FX
      Cash:          Local FX
    limits:
      Local FX:   [0.70, 1.00]
      Foreign FX: [0.00, 0.30]

# What the portfolio is measured — and, with a limit set below, optimized —
# against. Stated once so the report and the solve cannot disagree about it.
#
#   kind:      none | equal_weight | single_asset | custom_weights | external
#   asset:     the universe member, for kind: single_asset
#   weights:   {asset: weight}, for kind: custom_weights (normalized to 1)
#   rebalance: periodic (index convention) | buy_and_hold (weights drift)
benchmark:
  kind: equal_weight
  rebalance: periodic

# Active-risk limits, both measured against the benchmark's positions.
# Left unset here: this config also targets a 7% return, and a budget tight
# enough to be interesting puts that target out of reach — which the
# feasibility report will tell you, in those words, if you set both.
#
# max_tracking_error: 0.03   # √((w−b)'Σ(w−b)) ≤ 3% a year
# max_active_share: 0.50     # ½·Σ|wᵢ−bᵢ| ≤ 50%
